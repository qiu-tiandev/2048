<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS Variables ── */
    :root {
      --bg:          #faf8ef;
      --header-bg:   #faf8ef;
      --title-color: #776e65;
      --text:        #776e65;
      --subtext:     #bbada0;
      --score-bg:    #bbada0;
      --score-text:  #f9f6f2;
      --board-bg:    #bbada0;
      --cell-bg:     #cdc1b4;
      --btn-bg:      #8f7a66;
      --btn-text:    #f9f6f2;
      --shadow:      rgba(119,110,101,.2);
      --transition:  .15s ease;
    }
    [data-theme="dark"] {
      --bg:          #1a1a2e;
      --header-bg:   #1a1a2e;
      --title-color: #e0d8c8;
      --text:        #e0d8c8;
      --subtext:     #8877aa;
      --score-bg:    #16213e;
      --score-text:  #e0d8c8;
      --board-bg:    #16213e;
      --cell-bg:     #0f3460;
      --btn-bg:      #533483;
      --btn-text:    #e0d8c8;
      --shadow:      rgba(0,0,0,.4);
    }

    /* ── Tile Palette (light) ── */
    .t2    { background:#eee4da; color:#776e65; }
    .t4    { background:#ede0c8; color:#776e65; }
    .t8    { background:#f2b179; color:#f9f6f2; }
    .t16   { background:#f59563; color:#f9f6f2; }
    .t32   { background:#f67c5f; color:#f9f6f2; }
    .t64   { background:#f65e3b; color:#f9f6f2; }
    .t128  { background:#edcf72; color:#f9f6f2; }
    .t256  { background:#edcc61; color:#f9f6f2; }
    .t512  { background:#edc850; color:#f9f6f2; }
    .t1024 { background:#edc53f; color:#f9f6f2; }
    .t2048 { background:#edc22e; color:#f9f6f2; }
    .t4096 { background:#eee4da; color:#776e65; }
    .t8192 { background:#ede0c8; color:#776e65; }
    .t16384 { background:#f2b179; color:#f9f6f2; }
    .t32768 { background:#f59563; color:#f9f6f2; }
    .t65536 { background:#f67c5f; color:#f9f6f2; }
    .t131072 { background:#f65e3b; color:#f9f6f2; }
    .t262144 { background:#edcf72; color:#f9f6f2; }
    .t524288 { background:#edcc61; color:#f9f6f2; }
    .t1048576 { background:#edc850; color:#f9f6f2; }

    /* ── Dark-mode tile tweaks ── */
    /* Dark mode: keep original tile colors */

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Layout ── */
    .wrapper {
      width: min(500px, 100vw - 24px);
      padding: 20px 0 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 700;
      color: var(--title-color);
      line-height: 1;
      letter-spacing: -2px;
    }
    .scores-row {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: var(--score-bg);
      color: var(--score-text);
      border-radius: 6px;
      padding: 6px 14px;
      text-align: center;
      min-width: 72px;
      transition: background var(--transition);
    }
    .score-label {
      font-size: .6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .85;
      font-weight: 700;
    }
    .score-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.1;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hint {
      font-size: .8rem;
      color: var(--subtext);
    }
    .btn-row { display: flex; gap: 8px; align-items: center; }
    button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      transition: opacity .1s, background var(--transition);
    }
    button:hover { opacity: .85; }
    button:active { opacity: .7; }

    /* ── Dark Mode Toggle ── */
    .toggle {
      background: var(--score-bg);
      width: 42px;
      height: 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--btn-text);
      transition: transform .2s;
    }
    [data-theme="dark"] .toggle::after { transform: translateX(18px); }

    /* ── Board ── */
    .board-wrap {
      position: relative;
      background: var(--board-bg);
      border-radius: 10px;
      padding: 10px;
      aspect-ratio: 1;
      transition: background var(--transition);
      touch-action: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      height: 100%;
    }
    .cell {
      background: var(--cell-bg);
      border-radius: 6px;
      transition: background var(--transition);
    }

    /* ── Tiles ── */
    .tiles {
      position: absolute;
      inset: 10px;
      pointer-events: none;
    }
    .tile {
      position: absolute;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      transition: left .12s ease, top .12s ease, width .12s ease, height .12s ease;
      will-change: left, top;
    }
    .tile-inner {
      border-radius: 6px;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile.is-new .tile-inner    { animation: pop-in .12s ease; }
    .tile.is-merged .tile-inner { animation: merge .12s ease; }

    @keyframes pop-in {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes merge {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* ── Overlay ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(238,228,218,.73);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    [data-theme="dark"] .overlay { background: rgba(26,26,46,.8); }
    .overlay.show { display: flex; }
    .overlay-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--title-color);
    }
    .overlay-sub { font-size: .95rem; color: var(--subtext); }
  </style>
</head>
<body>
<div class="wrapper">
  <!-- Header -->
  <div class="header">
    <div class="title">2048</div>
    <div class="scores-row">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <span class="hint">Use arrow keys or swipe</span>
    <div class="btn-row">
      <button class="toggle" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <button id="newGameBtn">New Game</button>
    </div>
  </div>

  <!-- Board -->
  <div class="board-wrap" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">Game Over</div>
      <div class="overlay-sub" id="overlaySub">No moves left!</div>
      <button id="overlayBtn">Try Again</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   2048 — full game logic + rendering
   ════════════════════════════════════════ */
const GRID = 4;
const STORAGE_KEY  = '2048_state';
const BEST_KEY     = '2048_best';

let board = [], score = 0, best = 0, tileId = 0, moving = false;

/* ── DOM refs ── */
const $score     = document.getElementById('score');
const $best      = document.getElementById('best');
const $grid      = document.getElementById('grid');
const $tiles     = document.getElementById('tiles');
const $overlay   = document.getElementById('overlay');
const $oTitle    = document.getElementById('overlayTitle');
const $oSub      = document.getElementById('overlaySub');
const $oBtn      = document.getElementById('overlayBtn');
const $darkToggle= document.getElementById('darkToggle');
const $newGame   = document.getElementById('newGameBtn');

/* ── Init ── */
buildGrid();
loadTheme();
if (!loadState()) newGame();

/* ── Grid skeleton ── */
function buildGrid() {
  $grid.innerHTML = '';
  for (let i = 0; i < GRID * GRID; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    $grid.appendChild(c);
  }
}

/* ── New game ── */
function newGame() {
  board  = Array.from({length: GRID}, () => Array(GRID).fill(0));
  score  = 0;
  tileId = 0;
  $tiles.innerHTML = '';
  $overlay.classList.remove('show');
  updateScore();
  addTile(); addTile();
  renderBoard();
  saveState();
}

/* ── Tile placement ── */
function addTile(isLoad = false) {
  const empties = [];
  board.forEach((row, r) => row.forEach((v, c) => { if (!v) empties.push([r, c]); }));
  if (!empties.length) return;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  board[r][c] = Math.random() < .9 ? 2 : 4;
  if (!isLoad) spawnTileEl(r, c, board[r][c], true);
}

/* ── Render all tiles from board state ── */
function renderBoard() {
  $tiles.innerHTML = '';
  tileId = 0;
  board.forEach((row, r) => row.forEach((v, c) => {
    if (v) spawnTileEl(r, c, v, false);
  }));
}

/* ── Create a tile element ── */
function spawnTileEl(r, c, val, isNew) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.dataset.id = ++tileId;  el.dataset.r = r;
  el.dataset.c = c;  const inner = document.createElement('div');
  inner.className = 'tile-inner ' + tileClass(val);
  inner.style.fontSize = fontSize(val);
  inner.textContent = val;
  el.appendChild(inner);
  positionTile(el, r, c);
  if (isNew) el.classList.add('is-new');
  $tiles.appendChild(el);
  return el;
}

function positionTile(el, r, c) {
  el.dataset.r = r;
  el.dataset.c = c;
  const gap  = 10;
  const wrap = $tiles.getBoundingClientRect();
  const size = (wrap.width - gap * (GRID - 1)) / GRID;
  el.style.width  = size + 'px';
  el.style.height = size + 'px';
  el.style.left   = (c * (size + gap)) + 'px';
  el.style.top    = (r * (size + gap)) + 'px';
}

function tileClass(v) {
  if (v <= 1048576) return 't' + v;
  return 't1048576';
}
function fontSize(v) {
  if (v < 100)   return 'clamp(2rem, 8vw, 2.6rem)';
  if (v < 1000)  return 'clamp(1.6rem, 6vw, 2.2rem)';
  if (v < 10000) return 'clamp(1.3rem, 5vw, 1.8rem)';
  return 'clamp(1rem, 4vw, 1.4rem)';
}

/* ── Move logic ── */
function move(dir) {
  if (moving) return;
  
  // Save board to track what changed
  const prevBoard = board.map(row => [...row]);
  
  // Determine traversal order
  let rows = [...Array(GRID).keys()];
  let cols = [...Array(GRID).keys()];
  if (dir === 'right') cols = cols.reverse();
  if (dir === 'down')  rows = rows.reverse();

  let moved = false;
  const merged = new Set();
  const tileMovements = {}; // {$r,$c}: {oldR, oldC, newR, newC, val, merged: bool}

  // Process moves
  rows.forEach(r => cols.forEach(c => {
    const val = board[r][c];
    if (!val) return;

    let [tr, tc] = [r, c];
    while (true) {
      const [nr, nc] = step(tr, tc, dir);
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) break;
      if (board[nr][nc] === 0) {
        [tr, tc] = [nr, nc];
      } else if (board[nr][nc] === val && !merged.has(`${nr},${nc}`)) {
        [tr, tc] = [nr, nc];
        break;
      } else break;
    }

    if (tr === r && tc === c) return;
    moved = true;

    const isMerge = board[tr][tc] === val && !(tr === r && tc === c);
    
    if (isMerge) {
      merged.add(`${tr},${tc}`);
      const newVal = val * 2;
      score += newVal;
      if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); }
      
      // Record that merging tile moves to destination
      tileMovements[`${r},${c}`] = { oldR: r, oldC: c, newR: tr, newC: tc, val, merged: true, newVal };
      // Record that destination gets merged animation and value update
      tileMovements[`${tr},${tc}`] = { oldR: tr, oldC: tc, newR: tr, newC: tc, val, mergeTarget: true, newVal };
      
      board[r][c] = 0;
      board[tr][tc] = newVal;
    } else {
      // Regular slide
      tileMovements[`${r},${c}`] = { oldR: r, oldC: c, newR: tr, newC: tc, val, merged: false };
      board[r][c] = 0;
      board[tr][tc] = val;
    }
  }));

  if (!moved) return;

  moving = true;
  updateScore();

  // Get existing elements
  const tileMap = {};
  [...$tiles.querySelectorAll('.tile')].forEach(el => {
    const r = parseInt(el.dataset.r);
    const c = parseInt(el.dataset.c);
    tileMap[`${r},${c}`] = el;
  });

  // Animate all movements
  Object.entries(tileMovements).forEach(([key, move]) => {
    const el = tileMap[`${move.oldR},${move.oldC}`];
    if (!el) return;

    if (move.mergeTarget) {
      // This element is the merge target - stays in place but gets merge animation and value update
      el.classList.add('is-merged');
      setTimeout(() => {
        const inner = el.querySelector('.tile-inner');
        inner.className = 'tile-inner ' + tileClass(move.newVal);
        inner.style.fontSize = fontSize(move.newVal);
        inner.textContent = move.newVal;
      }, 60);
    } else if (move.merged) {
      // This element is merging - glide to target then remove
      positionTile(el, move.newR, move.newC);
      setTimeout(() => el.remove(), 120);
    } else {
      // Regular movement - glide to new position
      positionTile(el, move.newR, move.newC);
    }
  });

  // Spawn new tile immediately so pop-in animation starts with glide animation
  addTile();

  // Wait for animations to complete, then clean up
  setTimeout(() => {
    renderBoard();
    saveState();
    moving = false;
    checkEnd();
  }, 120);
}

function step(r, c, dir) {
  if (dir === 'up')    return [r - 1, c];
  if (dir === 'down')  return [r + 1, c];
  if (dir === 'left')  return [r, c - 1];
  if (dir === 'right') return [r, c + 1];
}

/* ── End detection ── */
function checkEnd() {
  if (!hasMove()) showOverlay('Game Over', 'No moves left!', false);
}

function hasMove() {
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++) {
      if (!board[r][c]) return true;
      if (r + 1 < GRID && board[r][c] === board[r+1][c]) return true;
      if (c + 1 < GRID && board[r][c] === board[r][c+1]) return true;
    }
  return false;
}

function showOverlay(title, sub, won) {
  $oTitle.textContent = title;
  $oSub.textContent   = sub;
  $oBtn.textContent   = won ? 'Keep Going' : 'Try Again';
  $overlay.classList.add('show');
  $oBtn.onclick = () => {
    $overlay.classList.remove('show');
    if (!won) newGame();
  };
}

/* ── Score display ── */
function updateScore() {
  $score.textContent = score;
  $best.textContent  = Math.max(score, best);
}

/* ── Persistence ── */
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ board, score, tileId }));
  localStorage.setItem(BEST_KEY, best);
}

function loadState() {
  try {
    const raw  = localStorage.getItem(STORAGE_KEY);
    const braw = localStorage.getItem(BEST_KEY);
    best = braw ? parseInt(braw) : 0;
    if (!raw) return false;
    const s = JSON.parse(raw);
    board  = s.board;
    score  = s.score;
    tileId = 0;
    updateScore();
    renderBoard();
    return true;
  } catch { return false; }
}

/* ── Theme ── */
function loadTheme() {
  const t = localStorage.getItem('2048_theme') || 'light';
  document.documentElement.dataset.theme = t;
}
$darkToggle.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('2048_theme', next);
});

/* ── Keyboard ── */
const keyMap = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right',
};
document.addEventListener('keydown', e => {
  const dir = keyMap[e.key];
  if (!dir) return;
  e.preventDefault();
  move(dir);
});

/* ── Touch / Swipe ── */
let tx0 = 0, ty0 = 0;
const board$ = document.getElementById('board');
board$.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
}, {passive:true});
board$.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else                              move(dy > 0 ? 'down'  : 'up');
}, {passive:true});

/* ── New game button ── */
$newGame.addEventListener('click', newGame);

/* ── Reposition on resize ── */
window.addEventListener('resize', () => {
  [...$tiles.querySelectorAll('.tile')].forEach(el => {
    const gap  = 10;
    const wrap = $tiles.getBoundingClientRect();
    const size = (wrap.width - gap * (GRID - 1)) / GRID;
    const c    = Math.round(parseFloat(el.style.left)  / (size + gap + Number.EPSILON));
    const r    = Math.round(parseFloat(el.style.top)   / (size + gap + Number.EPSILON));
    positionTile(el, r, c);
  });
});
</script>
</body>
</html>
